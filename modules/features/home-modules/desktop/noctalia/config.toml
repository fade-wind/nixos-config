[osd]
position = "top_right"

[shell]
avatar_path = "/home/fadewind/.config/assets/profile-pic/zel_icon.jpg"
external_ip_enabled = true
font_family = "JetBrainsMono NF"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
polkit_agent = true
settings_show_advanced = true
setup_wizard_enabled = false
telemetry_enabled = false
time_format = "{:%-I:%M %p}"

[shell.panel]
clipboard_placement = "attached"
launcher_placement = "attached"
open_near_click_clipboard = true
open_near_click_launcher = true
open_near_click_wallpaper = true

[shell.screenshot]
freeze_screen = true

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material"
source = "community"
wallpaper_scheme = "vibrant"

[theme.templates]
builtin_ids = ["btop", "kitty", "niri", "qt"]
community_ids = ["discord"]

[wallpaper]
directory = "/home/fadewind/.config/assets/wallpapers"
fill_mode = "center"

[wallpaper.default]
path = "/home/fadewind/.config/assets/wallpapers/XIV_Fire.jpg"

[wallpaper.last]
path = "/home/fadewind/.config/assets/wallpapers/XIV_Fire.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/fadewind/.config/assets/wallpapers/XIV_Fire.jpg"

[weather]
unit = "imperial"

[widget.active_window]
min_length = 0
title_scroll = "on_hover"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.launcher]
custom_image = "/run/current-system/sw/share/icons/hicolor/scalable/apps/nix-snowflake.svg"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.workspaces]
empty_color = "tertiary"
