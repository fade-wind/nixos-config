[bar.default]
border = "surface"
capsule = true
capsule_border = "primary"
capsule_padding = 8.0
capsule_thickness = 0.85999999999999999
center = ["audio_visualizer", "clock"]
end = [
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
margin_edge = 4.0
margin_ends = 4.0
padding = 6
start = ["group:g1"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border = "primary"
enabled = true
fill = "surface"
id = "g1"
members = ["launcher", "workspaces", "active_window"]
opacity = 1.0
padding = 8.0

