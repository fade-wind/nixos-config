[bar.default]
border = "surface"
capsule = true
capsule_border = "secondary"
capsule_padding = 8.0
capsule_thickness = 0.85999999999999999
center = [ "audio_visualizer", "clock" ]
color = "primary"
end = [ "group:g4", "group:g2", "group:g3" ]
margin_edge = 4.0
margin_ends = 4.0
padding = 6
shadow = false
start = [ "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "secondary"
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "launcher", "active-workspace", "workspaces", "active_window" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border = "secondary"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "tray", "notifications", "clipboard" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border = "secondary"
    enabled = true
    fill = "surface"
    foreground = "primary"
    id = "g3"
    members = [ "session", "network", "bluetooth", "widget", "battery" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border = "secondary"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "widget_2", "summary" ]
    opacity = 1.0
    padding = 8.0

