[mgr]
cwd = { fg = "#d8a657" }

# Hovered
hovered = { fg = "#d4be98", bg = "#3c3836" }
preview_hovered = { fg = "#d4be98", bg = "#3c3836" }

# Find
find_keyword = { fg = "#282828", bg = "#d8a657" }
find_position = { fg = "#282828", bg = "#7daea3" }

# Marker
marker_selected = { fg = "#a9b665", bg = "#a9b665" }
marker_copied = { fg = "#d8a657", bg = "#d8a657" }
marker_cut = { fg = "#ea6962", bg = "#ea6962" }

# Tab
tab_active = { fg = "#282828", bg = "#d8a657" }
tab_inactive = { fg = "#a89984", bg = "#3c3836" }

# Border
border_symbol = "│"
border_style = { fg = "#665c54" }

# Count
count_copied = { fg = "#282828", bg = "#d8a657" }
count_cut = { fg = "#282828", bg = "#ea6962" }
count_selected = { fg = "#282828", bg = "#a9b665" }

# Process
syntect_theme = "~/.config/yazi/gruvbox-material.tmTheme"

[mode]
normal_main = { fg = "#282828", bg = "#7daea3" }
normal_alt = { fg = "#a89984", bg = "#3c3836" }

select_main = { fg = "#282828", bg = "#a9b665" }
select_alt = { fg = "#a89984", bg = "#3c3836" }

unset_main = { fg = "#282828", bg = "#d8a657" }
unset_alt = { fg = "#a89984", bg = "#3c3836" }

[status]
overall = { fg = "#d4be98", bg = "#282828" }

sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type = { fg = "#7daea3" }
perm_read = { fg = "#a9b665" }
perm_write = { fg = "#e78a4e" }
perm_exec = { fg = "#ea6962" }

progress_label = { fg = "#282828", bg = "#d8a657" }
progress_normal = { fg = "#d8a657", bg = "#3c3836" }
progress_error = { fg = "#ea6962", bg = "#3c3836" }

[which]
mask = { bg = "#3c3836" }

cand = { fg = "#7daea3" }
rest = { fg = "#928374" }
desc = { fg = "#a89984" }

separator = "  "
separator_style = { fg = "#665c54" }

[confirm]
border = { fg = "#d8a657" }
title = { fg = "#d8a657" }

content = { fg = "#d4be98" }

list = { fg = "#d4be98" }
list_item = { fg = "#d4be98" }
list_title = { fg = "#a89984" }

btn_yes = { fg = "#282828", bg = "#a9b665" }
btn_no = { fg = "#282828", bg = "#ea6962" }

[spot]
border = { fg = "#665c54" }

title = { fg = "#d8a657" }

tbl_col = { fg = "#7daea3" }
tbl_cell = { fg = "#d4be98" }

[notify]
title_info = { fg = "#7daea3" }
title_warn = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

[icon]
globs = []
dirs = [
  { name = ".config", text = "", fg = "#ff9800" },
  { name = ".git", text = "", fg = "#e78a4e" },
  { name = ".github", text = "", fg = "#03a9f4" },
  { name = "Desktop", text = "", fg = "#e78a4e" },
  { name = "Documents", text = "", fg = "#e78a4e" },
  { name = "Downloads", text = "", fg = "#e78a4e" },
  { name = "Library", text = "", fg = "#e78a4e" },
  { name = "Movies", text = "", fg = "#e78a4e" },
  { name = "Music", text = "", fg = "#e78a4e" },
  { name = "Pictures", text = "", fg = "#e78a4e" },
  { name = "Projects", text = "", fg = "#e78a4e" },
  { name = "Public", text = "", fg = "#e78a4e" },
  { name = "Templates", text = "", fg = "#e78a4e" },
  { name = "Videos", text = "", fg = "#e78a4e" },
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#ffffff" },
  { if = "link", text = "", fg = "#9e9e9e" },
  { if = "block", text = "", fg = "#cddc39" },
  { if = "char", text = "", fg = "#cddc39" },
  { if = "fifo", text = "", fg = "#cddc39" },
  { if = "sock", text = "", fg = "#cddc39" },
  { if = "sticky", text = "", fg = "#cddc39" },
  { if = "dummy", text = "", fg = "#f44336" },

  # Fallback
  { if = "dir & hovered", text = "", fg = "#e78a4e" },
  { if = "dir", text = "", fg = "#e78a4e" },
  { if = "exec", text = "", fg = "#8bc34a" },
  { if = "!dir", text = "", fg = "#ffffff" },
]
[filetype]
rules = [
  { url = "*/", fg = "#a9b665" },

  { mime = "image/*", fg = "#7daea3" },
  { mime = "video/*", fg = "#d3869b" },
  { mime = "audio/*", fg = "#a9b665" },
  { mime = "application/zip", fg = "#e78a4e" },
  { mime = "application/gzip", fg = "#e78a4e" },
  { mime = "application/x-tar", fg = "#e78a4e" },
  { mime = "application/pdf", fg = "#ea6962" },
  { mime = "text/*", fg = "#d4be98" },
]
